[pytest]
# Bewusst hier statt im Repo-Root: das Root enthaelt ein __init__.py (der
# ComfyUI-Custom-Node-Entrypoint, der beim Import ComfyUI-Module zieht).
# Liegt die ini im Root, macht pytest daraus die Sammel-Wurzel, importiert
# dieses __init__.py und bricht ab. Mit der ini hier ist tests/ die Wurzel.
addopts = --import-mode=importlib
consider_namespace_packages = false
filterwarnings =
    ignore::DeprecationWarning
